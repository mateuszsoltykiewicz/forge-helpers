# CI/CD Deployment Job Example
# ServiceAccount-based deployment that bypasses resource management restrictions

---
# Namespace for CI/CD tools
apiVersion: v1
kind: Namespace
metadata:
  name: ci-cd
  labels:
    name: ci-cd
    forge.io/managed-by: platform-team

---
# ServiceAccount for deployment jobs
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployment-job
  namespace: ci-cd
  labels:
    forge.io/component: ci-cd
  annotations:
    description: "ServiceAccount for CI/CD deployment jobs"

---
# ClusterRole with permissions to deploy applications
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deployment-job-role
  labels:
    forge.io/component: ci-cd
rules:
  # Workload resources
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["create", "update", "patch", "delete", "get", "list", "watch"]
  
  # Core resources
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["create", "update", "patch", "delete", "get", "list", "watch"]
  
  # Batch resources
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["create", "update", "patch", "delete", "get", "list", "watch"]
  
  # Networking resources
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["create", "update", "patch", "delete", "get", "list", "watch"]
  
  # Storage resources
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "update", "patch", "delete", "get", "list", "watch"]
  
  # HPA and scaling
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["create", "update", "patch", "delete", "get", "list", "watch"]
  
  # Read-only for other resources
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "events"]
    verbs: ["get", "list", "watch"]

---
# ClusterRoleBinding to grant permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deployment-job-binding
  labels:
    forge.io/component: ci-cd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deployment-job-role
subjects:
  - kind: ServiceAccount
    name: deployment-job
    namespace: ci-cd

---
# Example Deployment Job (Kubernetes Job)
apiVersion: batch/v1
kind: Job
metadata:
  name: deploy-myapp-v2-0-0
  namespace: ci-cd
  labels:
    app: myapp
    version: v2.0.0
    forge.io/component: deployment
  annotations:
    forge.io/git-commit: "abc123def456"
    forge.io/git-branch: "main"
    forge.io/triggered-by: "github-actions"
    forge.io/build-url: "https://github.com/company/myapp/actions/runs/123456"
spec:
  # Don't restart on failure (manual re-deploy)
  backoffLimit: 0
  
  # Auto-cleanup after 24 hours
  ttlSecondsAfterFinished: 86400
  
  # Timeout after 10 minutes
  activeDeadlineSeconds: 600
  
  template:
    metadata:
      labels:
        app: myapp
        version: v2.0.0
    spec:
      # Use deployment-job ServiceAccount (bypasses Kyverno restrictions)
      serviceAccountName: deployment-job
      
      restartPolicy: Never
      
      containers:
        - name: deploy
          image: alpine/helm:3.13.0
          command:
            - sh
            - -c
            - |
              set -e
              
              echo "==================================="
              echo "Deploying myapp v2.0.0"
              echo "==================================="
              
              # Add Helm repository
              helm repo add mycompany https://charts.company.com
              helm repo update
              
              # Deploy application
              helm upgrade --install myapp mycompany/myapp \
                --namespace production \
                --create-namespace \
                --version 2.0.0 \
                --set image.tag=v2.0.0 \
                --set replicaCount=3 \
                --set resources.limits.cpu=1000m \
                --set resources.limits.memory=1Gi \
                --wait \
                --timeout 5m
              
              echo ""
              echo "==================================="
              echo "Deployment successful!"
              echo "==================================="
              
              # Verify deployment
              kubectl get deployment myapp -n production
              kubectl get pods -n production -l app=myapp
          
          env:
            - name: HELM_CACHE_HOME
              value: /tmp/helm/cache
            - name: HELM_CONFIG_HOME
              value: /tmp/helm/config
            - name: HELM_DATA_HOME
              value: /tmp/helm/data
          
          # Non-privileged security context
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          
          # Resource limits
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          
          # Writable directories
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: helm-cache
              mountPath: /tmp/helm
      
      volumes:
        - name: tmp
          emptyDir: {}
        - name: helm-cache
          emptyDir: {}

