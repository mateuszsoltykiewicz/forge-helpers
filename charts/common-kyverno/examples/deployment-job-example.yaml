# ==============================================================================
# Manual Deployment (Testing)
# ==============================================================================
# 
# Create Job manually for testing:
# 
# kubectl create job deploy-myapp-test \
#   --image=alpine/helm:3.13.0 \
#   --namespace=ci-cd \
#   --serviceaccount=deployment-job \
#   -- helm upgrade --install myapp ./charts/myapp --namespace production
# 
# Follow logs:
# kubectl logs -n ci-cd job/deploy-myapp-test -f
# 
# Check status:
# kubectl get job -n ci-cd deploy-myapp-test
# 
# Cleanup:
# kubectl delete job -n ci-cd deploy-myapp-test
# 
# ==============================================================================
# Monitoring Deployment Jobs
# ==============================================================================
# 
# List all deployment jobs:
# kubectl get jobs -n ci-cd -l forge.io/component=deployment
# 
# Failed jobs (need attention):
# kubectl get jobs -n ci-cd --field-selector status.successful=0
# 
# Recent deployments:
# kubectl get jobs -n ci-cd \
#   -l forge.io/component=deployment \
#   --sort-by=.metadata.creationTimestamp
# 
# Prometheus metrics:
# kube_job_status_succeeded{namespace="ci-cd"}
# kube_job_status_failed{namespace="ci-cd"}
# 
# ==============================================================================
# Security Best Practices
# ==============================================================================
# 
# 1. ServiceAccount Scope:
#    - deployment-job has ClusterRole (can deploy to any namespace)
#    - For namespace-specific deployments, use Role instead
# 
# 2. Audit Trail:
#    - All Job metadata includes Git commit, branch, triggered-by
#    - Kubernetes audit logs track all API calls
#    - Use labels for filtering and reporting
# 
# 3. Resource Limits:
#    - Set CPU/memory limits on deployment containers
#    - Use activeDeadlineSeconds to prevent hung jobs
#    - Use ttlSecondsAfterFinished for auto-cleanup
# 
# 4. Secret Management:
#    - Don't pass secrets as env vars
#    - Use External Secrets Operator
#    - Mount secrets as volumes with restrictive permissions
# 
# 5. RBAC Review:
#    - Regularly review deployment-job permissions
#    - Remove unused verbs
#    - Add namespace restrictions if possible
