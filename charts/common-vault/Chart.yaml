apiVersion: v2
name: common-vault
description: |
  HashiCorp Vault integration library for Forge platform.
  Provides Vault Agent Injector annotations, secret sections management,
  and environment variable verification patterns.
  
  Features:
  - Vault Agent Injector annotations (agent, cache, init, templates)
  - Sections-based secret organization (app, database, external-services, etc.)
  - Template generation for environment variable export
  - Variable verification with configurable verbosity
  - TLS support for Vault communication
  - Kubernetes authentication integration
  
  Pattern from: video-calling-service deployment

type: library
version: 0.1.0
appVersion: "1.16.0"  # Vault version

keywords:
  - library
  - forge
  - vault
  - secrets
  - hashicorp
  - kubernetes
  - security

maintainers:
  - name: Forge Team
    email: forge@example.com

dependencies:
  - name: common-forge
    version: ~0.1.0
    repository: file://../common-forge

annotations:
  moai.forge.io/chart-type: "library"
  moai.forge.io/component: "vault"
  moai.forge.io/integration: "hashicorp-vault"
