[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
minversion = 3.11
pythonpath = src

markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require AWS)

addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes

log_cli = false
log_cli_level = INFO
