# Test P0.4: Deployment + PDB (minAvailable >= replicas)
# Expected results:
#   - Pods: 6 (+1 because PDB minAvailable=5 >= replicas=5)
#   - PVCs: 0
#   - CPU: 3000m (500m × 5 × 1.2 buffer, NOT affected by +1 pod)
#   - Memory: 3072Mi (512Mi × 5 × 1.2 buffer, NOT affected by +1 pod)

apiVersion: v1
kind: Namespace
metadata:
  name: test-pdb-high
  labels:
    moai.forge.io/managed: "true"
    moai.forge.io/type: "application"
    moai.forge.io/owner: "platform-team"
    moai.forge.io/project: "forge-testing"
    moai.forge.io/environment: "test"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
  namespace: test-pdb-high
spec:
  replicas: 5
  selector:
    matchLabels:
      app: test-app
  template:
    metadata:
      labels:
        app: test-app
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: test-app-pdb
  namespace: test-pdb-high
spec:
  minAvailable: 5
  selector:
    matchLabels:
      app: test-app
