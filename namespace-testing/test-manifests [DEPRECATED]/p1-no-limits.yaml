apiVersion: v1
kind: Namespace
metadata:
  name: ns-p1-no-limits
  labels:
    moai.forge.io/managed: "true"
    moai.forge.io/type: "application"
    moai.forge.io/owner: "platform-team"
    moai.forge.io/project: "forge-testing"
    moai.forge.io/environment: "test"
---
# Deployment with no resource limits (edge case)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-nolimits
  namespace: ns-p1-no-limits
spec:
  replicas: 3
  selector:
    matchLabels:
      app: deploy-nolimits
  template:
    metadata:
      labels:
        app: deploy-nolimits
    spec:
      containers:
        - name: nginx
          image: nginx:1.21
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
---
# Deployment with limits only (no requests)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-limits-only
  namespace: ns-p1-no-limits
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deploy-limits-only
  template:
    metadata:
      labels:
        app: deploy-limits-only
    spec:
      containers:
        - name: nginx
          image: nginx:1.21
          resources:
            limits:
              cpu: "200m"
              memory: "256Mi"
