apiVersion: v1
kind: Namespace
metadata:
  name: ns-p1-mixed
  labels:
    moai.forge.io/managed: "true"
    moai.forge.io/type: "application"
    moai.forge.io/owner: "platform-team"
    moai.forge.io/project: "forge-testing"
    moai.forge.io/environment: "test"
---
# Deployment 1: Simple deployment with replicas
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-simple
  namespace: ns-p1-mixed
spec:
  replicas: 3
  selector:
    matchLabels:
      app: deploy-simple
  template:
    metadata:
      labels:
        app: deploy-simple
    spec:
      containers:
        - name: nginx
          image: nginx:1.21
          resources:
            limits:
              cpu: "100m"
              memory: "128Mi"
---
# Deployment 2: With HPA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-hpa
  namespace: ns-p1-mixed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deploy-hpa
  template:
    metadata:
      labels:
        app: deploy-hpa
    spec:
      containers:
        - name: nginx
          image: nginx:1.21
          resources:
            limits:
              cpu: "200m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-deploy
  namespace: ns-p1-mixed
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: deploy-hpa
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
---
# StatefulSet with PVCs
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sts-data
  namespace: ns-p1-mixed
spec:
  replicas: 2
  serviceName: sts-data
  selector:
    matchLabels:
      app: sts-data
  template:
    metadata:
      labels:
        app: sts-data
    spec:
      containers:
        - name: nginx
          image: nginx:1.21
          resources:
            limits:
              cpu: "150m"
              memory: "192Mi"
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# ReplicaSet standalone
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: rs-worker
  namespace: ns-p1-mixed
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rs-worker
  template:
    metadata:
      labels:
        app: rs-worker
    spec:
      containers:
        - name: busybox
          image: busybox
          command: ["/bin/sh", "-c", "sleep 3600"]
          resources:
            limits:
              cpu: "50m"
              memory: "64Mi"
