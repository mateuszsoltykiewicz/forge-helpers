# Test P0.2: Deployment + HPA (maxReplicas=10)
# Expected results:
#   - Pods: 10 (HPA maxReplicas, NOT current replicas=3)
#   - PVCs: 0
#   - CPU: 6000m (500m × 10 × 1.2 buffer)
#   - Memory: 6144Mi (512Mi × 10 × 1.2 buffer)

apiVersion: v1
kind: Namespace
metadata:
  name: test-hpa
  labels:
    moai.forge.io/managed: "true"
    moai.forge.io/type: "application"
    moai.forge.io/owner: "platform-team"
    moai.forge.io/project: "forge-testing"
    moai.forge.io/environment: "test"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
  namespace: test-hpa
spec:
  replicas: 3
  selector:
    matchLabels:
      app: test-app
  template:
    metadata:
      labels:
        app: test-app
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: test-app-hpa
  namespace: test-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: test-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
