apiVersion: v1
kind: Namespace
metadata:
  name: ns-p1-cronjob
  labels:
    moai.forge.io/managed: "true"
    moai.forge.io/type: "application"
    moai.forge.io/owner: "platform-team"
    moai.forge.io/project: "forge-testing"
    moai.forge.io/environment: "test"
---
# CronJob - should count concurrent jobs
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-job
  namespace: ns-p1-cronjob
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: backup
              image: busybox
              command: ["/bin/sh", "-c", "echo 'Running backup'; sleep 60"]
              resources:
                limits:
                  cpu: "200m"
                  memory: "256Mi"
          restartPolicy: OnFailure
---
# Regular Job
apiVersion: batch/v1
kind: Job
metadata:
  name: init-job
  namespace: ns-p1-cronjob
spec:
  parallelism: 2
  completions: 5
  template:
    spec:
      containers:
        - name: worker
          image: busybox
          command: ["/bin/sh", "-c", "echo 'Processing'; sleep 30"]
          resources:
            limits:
              cpu: "100m"
              memory: "128Mi"
      restartPolicy: OnFailure
