apiVersion: v1
kind: Namespace
metadata:
  name: ns-p1-zero-replicas
  labels:
    moai.forge.io/managed: "true"
    moai.forge.io/type: "application"
    moai.forge.io/owner: "platform-team"
    moai.forge.io/project: "forge-testing"
    moai.forge.io/environment: "test"
---
# Deployment scaled down to zero
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-zero
  namespace: ns-p1-zero-replicas
spec:
  replicas: 0
  selector:
    matchLabels:
      app: deploy-zero
  template:
    metadata:
      labels:
        app: deploy-zero
    spec:
      containers:
        - name: nginx
          image: nginx:1.21
          resources:
            limits:
              cpu: "100m"
              memory: "128Mi"
---
# HPA that can scale to zero (requires metrics-server)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-zero
  namespace: ns-p1-zero-replicas
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: deploy-zero
  minReplicas: 0
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
