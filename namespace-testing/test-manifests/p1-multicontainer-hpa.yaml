apiVersion: v1
kind: Namespace
metadata:
  name: ns-p1-multi-hpa
  labels:
    moai.forge.io/managed: "true"
    moai.forge.io/type: "application"
    moai.forge.io/owner: "platform-team"
    moai.forge.io/project: "forge-testing"
    moai.forge.io/environment: "test"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-hpa
  namespace: ns-p1-multi-hpa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multi-hpa
  template:
    metadata:
      labels:
        app: multi-hpa
    spec:
      initContainers:
        - name: init-setup
          image: busybox
          command: ["/bin/sh", "-c", "echo 'Init complete'"]
          resources:
            limits:
              cpu: "100m"
              memory: "64Mi"
      containers:
        - name: app
          image: nginx:1.21
          resources:
            limits:
              cpu: "400m"
              memory: "512Mi"
            requests:
              cpu: "200m"
              memory: "256Mi"
        - name: sidecar-logger
          image: busybox
          command: ["/bin/sh", "-c", "while true; do echo 'log'; sleep 30; done"]
          resources:
            limits:
              cpu: "100m"
              memory: "128Mi"
        - name: sidecar-metrics
          image: busybox
          command: ["/bin/sh", "-c", "sleep 3600"]
          resources:
            limits:
              cpu: "50m"
              memory: "64Mi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-multi
  namespace: ns-p1-multi-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: multi-hpa
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
