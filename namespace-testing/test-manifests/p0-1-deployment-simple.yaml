# Test P0.1: Deployment (replicas=2, no HPA/KEDA/VPA/PDB)
# Expected results:
#   - Pods: 2
#   - PVCs: 0
#   - CPU: 1200m (500m × 2 × 1.2 buffer)
#   - Memory: 1229Mi (512Mi × 2 × 1.2 buffer)

apiVersion: v1
kind: Namespace
metadata:
  name: test-simple
  labels:
    moai.forge.io/managed: "true"
    moai.forge.io/type: "application"
    moai.forge.io/owner: "platform-team"
    moai.forge.io/project: "forge-testing"
    moai.forge.io/environment: "test"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
  namespace: test-simple
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-app
  template:
    metadata:
      labels:
        app: test-app
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
