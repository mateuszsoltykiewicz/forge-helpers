# Common Monitoring Chart - Test Values
# UC02: Grafana Dashboard Provisioning

# Test metadata
testCase: "UC02-grafana-dashboard"
environment: "test"

# Forge naming convention
forge:
  customer: "test"
  project: "monitoring"
  environment: "test"
  service: "grafana-dashboard"

# Monitoring configuration
monitoring:
  enabled: true
  
  # Prometheus configuration (minimal for this UC)
  prometheus:
    enabled: false
    rules:
      availability:
        enabled: false
    serviceMonitor:
      enabled: false
  
  # Grafana configuration
  grafana:
    enabled: true
    
    # Dashboard provisioning via ConfigMap
    dashboards:
      enabled: true
      
    # Custom dashboard definition
    dashboard:
      enabled: true
      name: "test-application-metrics"
      folder: "Test"  # Grafana folder name
      
