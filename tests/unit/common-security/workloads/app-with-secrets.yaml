apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-with-secrets
  labels:
    app: secret-test
    security-test: hardcoded-secrets
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-test
  template:
    metadata:
      labels:
        app: secret-test
    spec:
      containers:
      - name: app
        image: busybox:latest
        command: ["sh", "-c", "sleep 3600"]
        env:
        # CRITICAL: Hardcoded AWS credentials
        - name: AWS_ACCESS_KEY_ID
          value: "AKIAIOSFODNN7EXAMPLE"  # Fake AWS access key (valid format)
        - name: AWS_SECRET_ACCESS_KEY
          value: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"  # Fake secret key
          
        # HIGH: Database password in plaintext
        - name: DB_PASSWORD
          value: "super_secret_password_123"
        - name: DATABASE_URL
          value: "postgres://admin:password123@db.example.com:5432/mydb"
          
        # HIGH: GitHub personal access token
        - name: GITHUB_TOKEN
          value: "ghp_1234567890abcdefghijklmnopqrstuvwxyz"
          
        # HIGH: Generic API key
        - name: API_KEY
          value: "sk-1234567890abcdefghijklmnopqrstuvwxyz"
          
        # HIGH: Slack webhook URL (placeholder — not a real secret)
        - name: SLACK_WEBHOOK
          value: "https://example.com/webhook/PLACEHOLDER_SLACK_WEBHOOK"
          
        # MEDIUM: JWT token
        - name: JWT_SECRET
          value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ"
          
        resources:
          limits:
            cpu: "100m"
            memory: "128Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
              - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: secret-test-app
  labels:
    app: secret-test
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: secret-test
