# UC-SECURITY-02: Secret Detection Configuration

trivy:
  enabled: true
  
  operator:
    # Configuration audit reports - detects secrets in manifests
    configAuditReports:
      enabled: true
      scanWorkloads: true
      
    # Exposed secret reports - detects secrets in images
    exposedsecretReports:
      enabled: true
      
    # Scan all namespaces
    scanJobsInNamespace: "*"
    
    # Severity levels
    severity:
      - CRITICAL
      - HIGH
      - MEDIUM
      - LOW
      
    # Resource limits
    resources:
      limits:
        cpu: "1000m"
        memory: "1Gi"
      requests:
        cpu: "500m"
        memory: "512Mi"
        
  # Trivy secret scanning configuration
  trivyConfig:
    # Enable secret detection
    secret:
      enabled: true
      
    # Secret patterns to detect
    secretPatterns:
      # AWS credentials
      - aws-access-key-id
      - aws-secret-access-key
      - aws-session-token
      
      # Cloud providers
      - gcp-api-key
      - azure-storage-key
      
      # Version control
      - github-token
      - gitlab-token
      - bitbucket-token
      
      # Generic patterns
      - generic-api-key
      - password
      - private-key
      - jwt-token
      
      # Messaging & collaboration
      - slack-webhook
      - discord-webhook
      - telegram-bot-token
      
      # Databases
      - postgres-connection-string
      - mysql-connection-string
      - mongodb-connection-string
      
      # Payment providers
      - stripe-api-key
      - paypal-token
      
    # File scanning limits
    maxFileSize: "1MB"
    
    # Skip binary files
    skipBinary: true

# Metrics and monitoring
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: "30s"
