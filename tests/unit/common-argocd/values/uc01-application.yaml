# UC01: Application Deployment via ArgoCD CRD
# Tests ArgoCD Application resource for GitOps-based deployment

argocdApplication:
  enabled: true
  name: test-app
  namespace: argocd
  
  project: default
  
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: guestbook
  
  destination:
    server: https://kubernetes.default.svc
    namespace: guestbook
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

# Optional: Manual sync settings
# syncPolicy:
#   syncOptions:
#     - CreateNamespace=true
