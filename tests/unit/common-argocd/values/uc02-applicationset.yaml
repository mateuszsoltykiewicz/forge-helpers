# UC02: Multi-Cluster ApplicationSet
# Tests ArgoCD ApplicationSet for deploying to multiple clusters

argocdApplicationSet:
  enabled: true
  name: multi-cluster-app
  namespace: argocd
  
  generators:
    - list:
        elements:
          - cluster: dev
            url: https://kubernetes.default.svc
            namespace: dev-apps
            replicas: "1"
          - cluster: staging
            url: https://staging-cluster.example.com
            namespace: staging-apps
            replicas: "2"
          - cluster: prod
            url: https://prod-cluster.example.com
            namespace: prod-apps
            replicas: "3"
  
  template:
    metadata:
      name: "guestbook-{{cluster}}"
      labels:
        environment: "{{cluster}}"
    
    spec:
      project: default
      
      source:
        repoURL: https://github.com/argoproj/argocd-example-apps.git
        targetRevision: HEAD
        path: guestbook
        helm:
          parameters:
            - name: replicaCount
              value: "{{replicas}}"
      
      destination:
        server: "{{url}}"
        namespace: "{{namespace}}"
      
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

# Alternative generators:
# - git: # Git generator (directories/files)
# - cluster: # Cluster generator (from cluster secrets)
# - pullRequest: # PR generator (GitHub/GitLab PRs)
# - matrix: # Matrix generator (combination of generators)
