# UC01: IRSA (IAM Roles for ServiceAccounts)
# Tests AWS IAM role binding to Kubernetes ServiceAccounts for secure AWS API access

serviceAccount:
  enabled: true
  name: s3-access-sa
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/s3-read-role"

deployment:
  enabled: true
  name: irsa-test-app
  image: amazon/aws-cli:2.13.0
  replicas: 1
  command: ["sleep", "3600"]
  
  env:
    - name: AWS_REGION
      value: "us-east-1"
    - name: S3_BUCKET
      value: "test-bucket"

