# UC02: Dynamic Database Credentials from Vault
# Tests Vault database secrets engine for generating short-lived credentials

vault:
  enabled: true
  address: "http://vault.vault.svc.cluster.local:8200"
  role: "db-user-role"
  databasePath: "database/creds/db-user"

deployment:
  enabled: true
  name: vault-db-app
  image: postgres:15-alpine
  replicas: 1
  
  # Vault annotations for database secrets
  podAnnotations:
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "db-user-role"
    vault.hashicorp.com/agent-inject-secret-db-creds: "database/creds/db-user"
    vault.hashicorp.com/secret-volume-path-db-creds: "/vault/secrets"
    vault.hashicorp.com/agent-inject-template-db-creds: |
      {{- with secret "database/creds/db-user" -}}
      export DB_USERNAME="{{ .Data.username }}"
      export DB_PASSWORD="{{ .Data.password }}"
      {{- end }}
  
  env:
    - name: VAULT_ADDR
      value: "http://vault.vault.svc.cluster.local:8200"

serviceAccount:
  enabled: true
  name: vault-db-sa
  annotations:
    vault.hashicorp.com/role: "db-user-role"
