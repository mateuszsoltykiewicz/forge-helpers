# UC-KUBERNETES-03: ConfigMap and Secret Management
#
# Tests ConfigMap and Secret creation, mounting, and environment variable injection

deployment:
  enabled: true
  name: config-app
  replicaCount: 1
  
  image:
    repository: busybox
    tag: "1.36.1"
    pullPolicy: IfNotPresent
  
  command: ["/bin/sh"]
  args:
    - -c
    - |
      echo "=== Environment Variables ==="
      echo "APP_NAME: $APP_NAME"
      echo "APP_VERSION: $APP_VERSION"
      echo "DATABASE_HOST: $DATABASE_HOST"
      echo "DATABASE_USER: $DATABASE_USER"
      echo "DATABASE_PASSWORD: $DATABASE_PASSWORD"
      echo ""
      echo "=== Mounted ConfigMap ==="
      cat /config/app.conf || echo "ConfigMap not mounted"
      echo ""
      echo "=== Mounted Secret ==="
      cat /secrets/credentials.txt || echo "Secret not mounted"
      echo ""
      echo "Sleeping... (check logs: kubectl logs config-app-xxx)"
      sleep 3600
  
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

# ConfigMap - Application Configuration
configMap:
  enabled: true
  name: app-config
  
  data:
    # Simple key-value pairs
    APP_NAME: "config-test-app"
    APP_VERSION: "1.0.0"
    LOG_LEVEL: "info"
    FEATURE_FLAGS: "feature1,feature2,feature3"
    
    # Configuration file
    app.conf: |
      [app]
      name = config-test-app
      version = 1.0.0
      
      [server]
      host = 0.0.0.0
      port = 8080
      
      [database]
      pool_size = 10
      timeout = 30s
      
      [logging]
      level = info
      format = json
    
    # JSON configuration
    config.json: |
      {
        "app": {
          "name": "config-test-app",
          "version": "1.0.0"
        },
        "features": {
          "auth": true,
          "caching": true,
          "monitoring": true
        }
      }
    
    # YAML configuration
    settings.yaml: |
      app:
        name: config-test-app
        environment: production
      database:
        host: db.example.com
        port: 5432

# Secret - Sensitive Data
secret:
  enabled: true
  name: app-secrets
  type: Opaque
  
  # String data (will be base64 encoded automatically)
  stringData:
    DATABASE_HOST: "db.example.com"
    DATABASE_USER: "app_user"
    DATABASE_PASSWORD: "super_secret_password_123"
    API_KEY: "sk_test_1234567890abcdef"
    JWT_SECRET: "my-jwt-secret-key-change-this-in-production"
    
    # Credentials file
    credentials.txt: |
      username=admin
      password=admin123
      api_key=1234567890abcdef
    
    # Database connection string
    database.url: "postgresql://app_user:super_secret_password_123@db.example.com:5432/myapp"

# Environment Variable Injection
env:
  # From ConfigMap
  - name: APP_NAME
    valueFrom:
      configMapKeyRef:
        name: app-config
        key: APP_NAME
  
  - name: APP_VERSION
    valueFrom:
      configMapKeyRef:
        name: app-config
        key: APP_VERSION
  
  # From Secret
  - name: DATABASE_HOST
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: DATABASE_HOST
  
  - name: DATABASE_USER
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: DATABASE_USER
  
  - name: DATABASE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: DATABASE_PASSWORD
  
  # Direct values
  - name: ENVIRONMENT
    value: "test"

# Volume Mounts for ConfigMap
volumeMounts:
  - name: config-volume
    mountPath: /config
    readOnly: true
  
  - name: secret-volume
    mountPath: /secrets
    readOnly: true

volumes:
  - name: config-volume
    configMap:
      name: app-config
      items:
        - key: app.conf
          path: app.conf
        - key: config.json
          path: config.json
  
  - name: secret-volume
    secret:
      secretName: app-secrets
      items:
        - key: credentials.txt
          path: credentials.txt
      defaultMode: 0400  # Read-only for owner

# Alternative: envFrom (inject all keys)
useEnvFrom: false
envFrom:
  - configMapRef:
      name: app-config
  - secretRef:
      name: app-secrets

