---
# ServiceAccount for CI/CD deployments (excluded from Kyverno policies)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployment-job
  namespace: ci-cd
  labels:
    purpose: "deployment"
    automated: "true"
  annotations:
    description: "ServiceAccount for automated deployments via CI/CD pipelines"

---
# ClusterRole for deployment-job (permissions to deploy applications)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deployment-job-role
  labels:
    purpose: "deployment"
rules:
  # Core resources
  - apiGroups: [""]
    resources:
      - pods
      - services
      - configmaps
      - secrets
      - serviceaccounts
      - persistentvolumeclaims
    verbs: ["create", "update", "patch", "delete", "get", "list", "watch"]
  
  # Apps resources
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["create", "update", "patch", "delete", "get", "list", "watch"]
  
  # Batch resources
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["create", "update", "patch", "delete", "get", "list", "watch"]
  
  # Networking resources
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["create", "update", "patch", "delete", "get", "list", "watch"]
  
  # Autoscaling resources
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["create", "update", "patch", "delete", "get", "list", "watch"]
  
  # RBAC resources (limited)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
    verbs: ["create", "update", "patch", "delete", "get", "list"]

---
# ClusterRoleBinding for deployment-job
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deployment-job-binding
  labels:
    purpose: "deployment"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deployment-job-role
subjects:
  - kind: ServiceAccount
    name: deployment-job
    namespace: ci-cd

---
# ServiceAccount for debug proxy (controlled API access)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: debug-proxy
  namespace: kube-system
  labels:
    purpose: "debugging"
  annotations:
    description: "ServiceAccount for controlled access to blocked Kubernetes APIs (exec, port-forward)"

---
# ClusterRole for debug-proxy (exec and port-forward permissions)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: debug-proxy-role
  labels:
    purpose: "debugging"
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
    verbs: ["get", "list", "watch"]
  
  - apiGroups: [""]
    resources:
      - pods/exec
      - pods/portforward
      - pods/attach
    verbs: ["create", "get"]

---
# ClusterRoleBinding for debug-proxy
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: debug-proxy-binding
  labels:
    purpose: "debugging"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: debug-proxy-role
subjects:
  - kind: ServiceAccount
    name: debug-proxy
    namespace: kube-system

---
# ServiceAccount for simulated Flux GitOps
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-cd
  namespace: flux-system
  labels:
    purpose: "gitops"
    automated: "true"
  annotations:
    description: "ServiceAccount simulating Flux CD for GitOps workflow testing"

---
# ClusterRole for flux-cd (full deployment permissions)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flux-cd-role
  labels:
    purpose: "gitops"
rules:
  # Full permissions for GitOps operator
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]

---
# ClusterRoleBinding for flux-cd
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-cd-binding
  labels:
    purpose: "gitops"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-cd-role
subjects:
  - kind: ServiceAccount
    name: flux-cd
    namespace: flux-system

---
# ServiceAccount for regular test user (will be blocked by policies)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-user
  namespace: test-app
  labels:
    purpose: "testing"
  annotations:
    description: "Regular user ServiceAccount (no special permissions, used to test policy enforcement)"

---
# Role for test-user (minimal read permissions)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: test-user-role
  namespace: test-app
  labels:
    purpose: "testing"
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - configmaps
    verbs: ["get", "list", "watch"]

---
# RoleBinding for test-user
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: test-user-binding
  namespace: test-app
  labels:
    purpose: "testing"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: test-user-role
subjects:
  - kind: ServiceAccount
    name: test-user
    namespace: test-app
