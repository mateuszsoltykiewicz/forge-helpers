[pytest]
# ==============================================================================
# Pytest Configuration for Security Group Chainer
# ==============================================================================

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 3.11

# Add current directory to Python path
pythonpath = src

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require AWS credentials)
    e2e: End-to-end tests (require full Terraform setup)
    performance: Performance and load tests
    slow: Tests that take significant time to run
    aws: Tests that interact with AWS services
    terraform: Tests that interact with Terraform
    asyncio: Async tests (automatically detected by pytest-asyncio)

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:cacheprovider
    --color=yes

# Coverage options (if pytest-cov is installed)
# addopts = --cov=src --cov-report=term-missing --cov-report=html

# Timeout for tests (if pytest-timeout is installed)
# timeout = 300

# Parallel execution (if pytest-xdist is installed)
# addopts = -n auto

# Log settings
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
